<div class="auth-page">
  <div class="container py-4 py-lg-5">
    <div class="auth-layout">

      <!-- Columna visual -->
      <section class="auth-visual">
        <div class="visual-overlay"></div>

        <div class="visual-content">
          <img src="/assets/logo-mario.png" alt="Mario Plus Logo" class="visual-logo">

          <p class="visual-tag">Companion App</p>
          <h1 class="visual-title">Únete al universo Mario+</h1>
          <p class="visual-text">
            Regístrate para acceder a retos, curiosidades, progreso personalizado
            y contenido exclusivo del universo Mario Bros.
          </p>
        </div>
      </section>

      <!-- Columna formulario -->
      <section class="auth-form-panel">
        <div class="form-inner">
          <a routerLink="/onboarding" class="back-link text-decoration-none">← Back</a>

          <div class="text-center mb-4">
            <img src="/assets/logo-mario.png" alt="Mario Plus Logo" class="form-logo mb-3">
            <h2 class="auth-title mb-2">Regístrate</h2>
            <p class="help-text mb-0">¿Necesitas ayuda? <a href="#">Haz click aquí</a></p>
          </div>

          <form>
            <div class="mb-3">
              <label class="form-label auth-label">Nombre</label>
              <input type="text" class="form-control auth-input" placeholder="Value">
            </div>

            <div class="mb-3">
              <label class="form-label auth-label">Username</label>
              <input type="text" class="form-control auth-input" placeholder="Value">
            </div>

            <div class="mb-3">
              <label class="form-label auth-label">Email</label>
              <input type="email" class="form-control auth-input" placeholder="Value">
            </div>

            <div class="mb-4">
              <label class="form-label auth-label">Contraseña</label>
              <input type="password" class="form-control auth-input" placeholder="Value">
            </div>

            <div class="d-grid mb-4">
              <button type="button" class="btn register-btn">Registrar</button>
            </div>

            <p class="text-center social-text mb-3">o usa una de tus redes sociales</p>

            <div class="d-grid mb-4">
              <button type="button" class="btn google-btn">Regístrate con Google</button>
            </div>

            <div class="d-flex justify-content-between align-items-end mt-4 auth-footer-links">
              <div class="login-question">¿Tienes una<br>cuenta?</div>
              <a routerLink="/home" class="login-link text-decoration-none">Inicia Sesión</a>
            </div>
          </form>
        </div>
      </section>

    </div>
  </div>
</div>
