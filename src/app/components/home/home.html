<div class="home-page">
  <header class="site-header">
    <div class="container">
      <div class="header-inner">

        <div class="brand-area">
          <!-- Property Binding: la imagen se carga desde una variable del TS -->
          <img [src]="logoApp" alt="Logo Mario Plus" class="brand-logo-img">
        </div>

        <nav class="main-nav">
          <a routerLink="/home" class="nav-link active-link">Home</a>
          <a routerLink="/mundos" class="nav-link">Mundos</a>
          <a routerLink="/personajes" class="nav-link">Personajes</a>
          <a routerLink="/games" class="nav-link">Juegos</a>
        </nav>

        <div class="header-actions">
          <div class="search-box">
            <input type="text" placeholder="Buscar" />
          </div>
          <a routerLink="/profile" class="profile-btn">Perfil</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-4 py-lg-5">
    <section class="hero-panel">
      <div class="row align-items-center g-4">
        <div class="col-lg-7">
          <div class="hero-copy">
            <p class="mini-label mb-2">Companion App</p>

            <!-- Interpolación: muestra el nombre del usuario -->
            <h1 class="hero-title">Hi, {{ nombreUsuario }}</h1>

            <!-- Interpolación: muestra el mensaje dinámico -->
            <p class="hero-text">
              {{ mensajeProgreso }}
            </p>

            <div class="hero-actions">
              <!-- Event Binding: ejecuta una función al hacer clic -->
              <button class="btn btn-light btn-lg rounded-pill px-4" (click)="verSeccion('Curiosidades')">
                Curiosidades
              </button>

              <button class="btn btn-outline-light btn-lg rounded-pill px-4" (click)="verSeccion('Reto del Día')">
                Reto del Día
              </button>
            </div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="progress-panel">
            <div class="progress-circle">
              <!-- Interpolación: muestra el porcentaje actual -->
              <div class="progress-circle-inner">{{ porcentajeProgreso }}%</div>
            </div>

            <div class="level-info">
              <!-- Interpolación -->
              <h3 class="mb-1">Nivel {{ nivelUsuario }}</h3>

              <!-- Interpolación -->
              <p class="mb-0">{{ mensajeNivel }}</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="stats-section mt-4">
      <div class="row g-3">
        <div class="col-md-4">
          <div class="stat-card">
            <h3>120</h3>
            <p>partidas</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card">
            <h3>47</h3>
            <p>racha máxima</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="stat-card">
            <h3>0.43</h3>
            <p>mejor marca</p>
          </div>
        </div>
      </div>
    </section>

    <section class="quick-section mt-4">
  <div class="row g-4">

    <!-- Cada card completa funciona como botón -->
    <div class="col-md-6 col-xl-4" *ngFor="let acceso of accesosRapidos">
      <button
        type="button"
        class="quick-card quick-card-button"
        (click)="verSeccion(acceso.titulo)">

        <!-- Property Binding -->
        <img [src]="acceso.imagen" [alt]="acceso.titulo" class="quick-image">

        <!-- Interpolación -->
        <h4>{{ acceso.titulo }}</h4>

        <!-- Interpolación -->
        <p>{{ acceso.descripcion }}</p>
      </button>
    </div>

    <div class="col-xl-4">
      <button
        type="button"
        class="unlock-card unlock-card-button"
        (click)="verSeccion('Contenido desbloqueable')">

        <img src="/assets/desbloqueo-card.jpg" alt="Contenido desbloqueable" class="unlock-image">

        <div class="unlock-overlay">
          <h4>Juega para desbloquear</h4>
          <p>Accede a contenido exclusivo al cumplir tus metas.</p>
        </div>
      </button>
    </div>
  </div>
</section>
  </main>
</div>
