<div class="mundos-page">

  <!-- Barra superior de navegación -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">

        <!-- Logo -->
        <div class="brand-area">
          <img [src]="logoApp" alt="Logo Mario Plus" class="brand-logo-img">
        </div>

        <!-- Menú -->
        <nav class="main-nav">
          <a routerLink="/home" class="nav-link">Home</a>
          <a routerLink="/mundos" class="nav-link active-link">Mundos</a>
          <a routerLink="/personajes" class="nav-link">Personajes</a>
          <a routerLink="/games" class="nav-link">Juegos</a>
        </nav>

        <!-- Acciones -->
        <div class="header-actions">
          <div class="search-box">
            <input type="text" placeholder="Buscar" />
          </div>
          <a routerLink="/profile" class="profile-btn">Perfil</a>
        </div>
      </div>
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="container py-4 py-lg-5">
    <section class="cabecera-mundos p-5 rounded-4 shadow-sm text-white mb-4">
      <div class="worlds-hero mb-5 d-flex align-items-center">
        <div class="worlds-hero-overlay"></div>

        <div class="worlds-hero-content w-100">
          <span class="worlds-tag">{{ etiquetaMundos }}</span>
          <h1 class="worlds-title">{{ tituloMundos }}</h1>
          <p class="worlds-text">
            {{ descripcionMundos }}
          </p>

          <div class="d-flex gap-3 mt-4 justify-content-start text-start">
            <button
              type="button"
              (click)="irAListadoMundos()"
              class="btn btn-light px-4 py-2 fw-bold rounded-pill text-danger">
              Explorar Mundos
            </button>

            <button
              type="button"
              routerLink="/home"
              class="btn bg-transparent px-4 py-2 fw-bold rounded-pill text-white border border-white shadow-sm">
              Volver a Home
            </button>
          </div>
        </div>
      </div>

      <!-- Rejilla de tarjetas -->
      <div id="listado-mundos" class="row g-4">
        <div class="col-12 col-md-6 col-lg-4" *ngFor="let mundo of mundos">
          <div class="world-card">
            <img [src]="mundo.imagen" [alt]="mundo.nombre" class="world-image">
            <div class="world-card-body">
              <span class="world-badge">{{ mundo.etiqueta }}</span>
              <h3>{{ mundo.nombre }}</h3>
              <p>{{ mundo.descripcion }}</p>
              <button class="btn btn-mario w-100" (click)="explorarMundo(mundo.nombre)">
                Explorar Detalles
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
